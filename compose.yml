version: '3.8'

services:
  # --- BANCOS POSTGRESQL (ACID) ---
  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - backend

  inventory-db:
    image: postgres:16-alpine
    container_name: inventory-db
    ports:
      - "5433:5432" # Porta externa 5433 para não conflitar no host
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory_db
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - backend

  # --- BANCOS MONGODB (DOCUMENTOS) ---
  order-mongo:
    image: mongo:7-jammy
    container_name: order-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: order_user
      MONGO_INITDB_ROOT_PASSWORD: order_pass
      MONGO_INITDB_DATABASE: order_db
    volumes:
      - order-mongo-data:/data/db
    networks:
      - backend

  notification-mongo:
    image: mongo:7-jammy
    container_name: notification-mongo
    ports:
      - "27018:27017" # Porta externa 27018 para não conflitar no host
    environment:
      MONGO_INITDB_ROOT_USERNAME: notification_user
      MONGO_INITDB_ROOT_PASSWORD: notification_pass
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - notification-mongo-data:/data/db
    networks:
      - backend

  # --- MENSAGERIA E CACHE ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

volumes:
  payment-db-data:
    driver: local
  inventory-db-data:
    driver: local
  order-mongo-data:
    driver: local
  notification-mongo-data:
    driver: local
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local

networks:
  backend:
    driver: bridge